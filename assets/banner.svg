<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .animated-bg-1 { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .animated-card-1 { animation: float1 5s infinite ease-in-out; transform-origin: center; }
    .animated-card-2 { animation: float2 7s infinite ease-in-out; transform-origin: center; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic/Animated Background Elements (Behind text) -->
  <g class="animated-bg-1">
    <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.08" />
    <circle cx="1050" cy="220" r="160" fill="#818cf8" opacity="0.08" />
  </g>

  <!-- Animated Decorative Side Cards (Placed far right so they never overlap main text) -->
  <g class="animated-card-1">
    <rect x="920" y="45" width="220" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.85" />
    <text x="940" y="80" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">🛡️ Consent Automation</text>
    <text x="940" y="105" fill="#64748b" font-family="sans-serif" font-size="12">GDPR &amp; CCPA Enforcement</text>
  </g>

  <g class="animated-card-2">
    <rect x="950" y="160" width="210" height="85" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.85" />
    <text x="970" y="195" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="14">⚡ Privacy as Code</text>
    <text x="970" y="220" fill="#64748b" font-family="sans-serif" font-size="12">DSR &amp; Data Discovery</text>
  </g>

  <!-- Foreground Main Content (Guaranteed foreground placement) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="45" width="290" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="16" y="66" class="badge-text">🔒 AWESOME PRIVACY RISK MANAGEMENT</text>

    <!-- Main Title -->
    <text x="0" y="130" class="title" filter="url(#glow)">Privacy Risk Management</text>
    <text x="0" y="180" class="title">Software &amp; Tools Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle">Curated SaaS Platforms, Open-Source Solutions, Consent Engines &amp; Privacy Engineering</text>
  </g>
</svg>
